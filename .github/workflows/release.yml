name: Release

# Runs when a version tag is pushed, or manually from the Actions tab with a version
# (the tag is then created on the checked-out commit). Obsidian requires the tag to
# equal manifest.json's version exactly (e.g. 1.0.0, no "v").
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal manifest.json's version (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version matches manifest
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "Version $VERSION does not match manifest.json version $manifest_version" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      # 0.x versions are published as pre-releases so BRAT users can install them.
      # 1.0.0 and later are created as drafts for a human to review and publish.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=--draft
          if [[ "$VERSION" == 0.* ]]; then kind=--prerelease; fi
          gh release create "$VERSION" main.js manifest.json "$kind" \
            --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
