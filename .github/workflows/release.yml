name: Release

# Obsidian requires the tag to equal the version exactly (e.g. 1.0.0, no "v").
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      # 0.x versions are published as pre-releases so BRAT users can install them.
      # 1.0.0 and later are created as drafts for a human to review and publish.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == 0.* ]]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --prerelease --generate-notes --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
